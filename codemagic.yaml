workflows:
  flutter-android-build:
    name: Reelzy Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > reelzy-frontend/android/local.properties
      - name: Get Flutter packages
        script: |
          cd reelzy-frontend
          flutter pub get
      - name: Build Android APK
        script: |
          cd reelzy-frontend
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - reelzy-frontend/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - varunapinsara640@gmail.com
